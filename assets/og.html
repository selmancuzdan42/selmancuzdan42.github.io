<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; }
  body {
    width: 1200px; height: 630px; overflow: hidden; position: relative;
    background: #080A0F; color: #EDF0F4;
    font-family: 'Archivo', sans-serif; -webkit-font-smoothing: antialiased;
  }
  .glow-a, .glow-b { position: absolute; border-radius: 50%; filter: blur(90px); }
  .glow-a { top: -180px; right: -120px; width: 620px; height: 620px;
    background: radial-gradient(circle, rgba(255,162,58,.30), rgba(255,162,58,.06) 46%, transparent 70%); }
  .glow-b { bottom: -240px; left: -140px; width: 660px; height: 660px;
    background: radial-gradient(circle, rgba(106,79,216,.30), rgba(76,127,232,.08) 48%, transparent 72%); }
  .grid { position: absolute; inset: 0;
    background-image:
      linear-gradient(to right, rgba(255,255,255,.032) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(255,255,255,.032) 1px, transparent 1px);
    background-size: 76px 76px;
    -webkit-mask-image: radial-gradient(ellipse 88% 70% at 50% 30%, #000, transparent 78%); }

  .wrap { position: relative; height: 100%; padding: 72px 76px;
    display: flex; flex-direction: column; justify-content: space-between; }

  .mark { display: flex; align-items: baseline; gap: 9px;
    font-family: 'IBM Plex Mono', monospace; font-size: 24px; font-weight: 600; }
  .mark i { color: #FFA23A; font-style: normal; }
  .caret { display: inline-block; width: 12px; height: 24px; margin-left: 4px;
    background: #FFA23A; box-shadow: 0 0 12px rgba(255,162,58,.8); transform: translateY(3px); }

  h1 { font-size: 96px; font-weight: 800; line-height: .96; letter-spacing: -.03em;
    font-variation-settings: 'wdth' 106; }
  h1 .amber { background: linear-gradient(100deg, #EDF0F4 0%, #EDF0F4 16%, #FFC77E 62%, #FFA23A 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .role { margin-top: 22px; font-family: 'IBM Plex Mono', monospace;
    font-size: 25px; letter-spacing: .01em; color: #A6B1C0; }

  .strip { display: flex; align-items: center; gap: 26px; padding-top: 30px;
    border-top: 1px solid rgba(255,255,255,.075); }
  .stat b { display: block; font-size: 40px; font-weight: 800; letter-spacing: -.035em;
    color: #FFA23A; font-variation-settings: 'wdth' 98; line-height: 1; }
  .stat span { display: block; margin-top: 6px; font-family: 'IBM Plex Mono', monospace;
    font-size: 14px; letter-spacing: .05em; color: #6E7A8A; }
  .sep { width: 1px; height: 46px; background: rgba(255,255,255,.09); }
  .url { margin-left: auto; font-family: 'IBM Plex Mono', monospace;
    font-size: 18px; color: #6E7A8A; }
</style>
</head>
<body>
  <div class="glow-a"></div><div class="glow-b"></div><div class="grid"></div>

  <div class="wrap">
    <p class="mark"><i>~$</i> s3lm4n<span class="caret"></span></p>

    <div>
      <h1>Selman Farisi<br><span class="amber">Cüzdan</span></h1>
      <p class="role">Ofansif güvenlik araştırmacısı · CTF · Bug bounty</p>
    </div>

    <div class="strip">
      <div class="stat"><b>6</b><span>yarışma derecesi</span></div>
      <div class="sep"></div>
      <div class="stat"><b>2</b><span>Türkiye ikinciliği</span></div>
      <div class="sep"></div>
      <div class="stat"><b>#95</b><span>HTB dünya sırası</span></div>
      <p class="url">selmancuzdan42.github.io</p>
    </div>
  </div>
</body>
</html>
